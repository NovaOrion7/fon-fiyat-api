name: Update Funds Data

on:
  schedule:
    # Her akşam saat 21:00'de çalışır (UTC'ye göre 18:00)
    - cron: '0 18 * * 1-5'
  workflow_dispatch: # Manuel tetiklemeye izin verir

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Gereksinimleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 yfinance

    - name: Scraper'ı Çalıştır
      run: |
        cd backend
        python scraper.py

    - name: Değişiklikleri Commit Et
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add backend/funds.json
        # Eğer funds.json'da değişiklik varsa commit et, yoksa hata verme
        git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Güncelleme: Günlük fon fiyatları [skip ci]" && git push)
